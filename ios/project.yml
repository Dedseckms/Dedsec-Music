name: DedSecMusic
options:
  bundleIdPrefix: ru.dedseckms
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    CODE_SIGNING_ALLOWED: NO
packages:
  MusicCore:
    path: Core
targets:
  DedSecMusic:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Resources
    dependencies:
      - package: MusicCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.dedseckms.music
        PRODUCT_NAME: DedSecMusic
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Info.plist
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        SUPPORTS_MACCATALYST: NO
schemes:
  DedSecMusic:
    build:
      targets:
        DedSecMusic: all
